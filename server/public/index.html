<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escrow Test Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◈</span>
      <div>
        <h1>Escrow Test Console</h1>
        <p class="sub">Local API · <span id="health">checking…</span></p>
      </div>
    </div>
    <div class="who">
      <span class="who-name" id="who-name">Not signed in</span>
      <span class="pill" id="who-role" hidden></span>
      <span class="wallet" id="who-wallet" hidden></span>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>Sign in</h2>
        <form id="login-form">
          <label>Phone
            <input id="login-phone" name="phone" placeholder="+254712345678" autocomplete="username" required>
          </label>
          <label>Password
            <input id="login-password" name="password" type="password" placeholder="password123" autocomplete="current-password" required>
          </label>
          <button class="primary full" type="submit">Sign in</button>
        </form>
        <div class="quick" role="group" aria-label="Seeded accounts">
          <button type="button" data-phone="+254712345678" data-label="Alice · payer">Alice<span class="role">payer · KYC 1</span></button>
          <button type="button" data-phone="+254798765432" data-label="Bob · payee">Bob<span class="role">payee · KYC 1</span></button>
          <button type="button" data-phone="+254700000002" data-label="Support · support">Support<span class="role">resolves disputes</span></button>
          <button type="button" data-phone="+254700000001" data-label="Admin · admin">Admin<span class="role">full access</span></button>
        </div>

      <section class="card">
        <h2>Accounts <span class="count" id="session-count">0</span></h2>
        <ul class="sessions" id="session-list">
          <li class="empty">No accounts signed in.</li>
        </ul>
      </section>

      <section class="card" id="create-card" hidden>
        <h2>Create order</h2>
        <form id="create-form">
          <label>Payer
            <select id="payer-select"></select>
          </label>
          <button class="primary full" type="submit" id="create-btn">Create draft</button>
        </form>
        <p class="hint">You act as the payee. Sign in a second account to choose a payer.</p>
      </section>

      <section class="card" id="admin-card" hidden>
        <h2>Admin &amp; support</h2>
        <div class="stats" id="admin-stats"></div>
        <button class="small" type="button" id="load-admin">Refresh disputes &amp; stats</button>
        <ul class="disputes mt" id="dispute-list">
          <li class="empty">No disputes loaded.</li>
        </ul>
      </section>
    </aside>

    <section class="content">
      <div class="content-head">
        <h2>Orders</h2>
        <div class="tools">
          <button class="small" type="button" id="refresh-orders">Refresh</button>
        </div>
      </div>
      <div class="orders" id="orders">
        <p class="empty">Sign in to see orders.</p>
      </div>
    </section>
  </main>

  <section class="log-wrap">
    <div class="log-panel">
      <div class="content-head">
        <h2>Activity</h2>
        <button class="small ghost" type="button" id="clear-log">Clear</button>
      </div>
      <ol class="log" id="log"></ol>
    </div>
  </section>

  <div class="flash" id="flash" role="status" aria-live="polite" hidden></div>

  <template id="order-tpl">
    <article class="order">
      <div class="order-head">
        <div>
          <span class="state" data-f="state"></span>
          <div class="order-id" data-f="short"></div>
        </div>
        <div class="amount" data-f="amount"></div>
      </div>
      <div class="order-meta">
        <div class="meta-item"><span class="meta-label">Payer</span><span class="meta-value" data-f="payer"></span></div>
        <div class="meta-item"><span class="meta-label">Payee</span><span class="meta-value" data-f="payee"></span></div>
        <div class="meta-item"><span class="meta-label">Terms</span><span class="meta-value terms-line" data-f="terms"></span></div>
      </div>
      <div class="actions" data-f="actions"></div>
      <div class="inline-form" data-f="form" hidden></div>
      <details class="raw">
        <summary>Raw order</summary>
        <pre data-f="raw"></pre>
      </details>
    </article>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
